name: CI - Gates de Qualidade (AUD-014)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-gate:
    name: Python Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilação sintática (py_compile)
        run: |
          python -m compileall scripts/

      - name: Executar testes automatizados (unittest)
        run: |
          python -m unittest discover -s scripts/tests

  frontend-gate:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apresentacao_comercial
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apresentacao_comercial/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gate de Lint (ESLint sem erros)
        run: npm run lint

      - name: Gate de Tipagem (TypeScript)
        run: npx tsc --noEmit

      - name: Executar testes automatizados
        run: npm test

      - name: Gate de Build (Next.js)
        run: npm run build
